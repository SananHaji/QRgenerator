import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    // Firebase project qr-generator-41249; app/google-services.json lists both the store and the .hhm id.
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// Upload key for Play App Signing. signing/keystore.properties and the keystore are not in git;
// without them release builds are produced unsigned.
def releaseSigningFile = rootProject.file('signing/keystore.properties')
def releaseSigning = null
if (releaseSigningFile.exists()) {
    releaseSigning = new Properties()
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

// Switch for the HHM company build; see gradle.properties.
def hhmEnabled = providers.gradleProperty('qrgenerator.hhm.enabled')
        .map { it.toBoolean() }
        .getOrElse(false)

android {
    namespace 'com.sananhaji.qrgenerator'
    compileSdk 36

    defaultConfig {
        applicationId "com.sananhaji.qrgenerator"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1"
        manifestPlaceholders = [firebaseCollectionEnabled: "true"]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // store: public Play Store app. hhm: company build with the certificate template.
    // Without the hhm flavor its source set (src/hhm) is not compiled or packaged at all.
    flavorDimensions = ["distribution"]
    productFlavors {
        store {
            dimension "distribution"
        }
        if (hhmEnabled) {
            hhm {
                dimension "distribution"
                applicationIdSuffix ".hhm"
                versionNameSuffix "-hhm"
            }
        }
    }

    signingConfigs {
        if (releaseSigning != null) {
            release {
                storeFile rootProject.file(releaseSigning['storeFile'])
                storePassword releaseSigning['storePassword']
                keyAlias releaseSigning['keyAlias']
                keyPassword releaseSigning['keyPassword']
            }
        }
    }

    buildTypes {
        // Keep test runs out of the production Crashlytics and Analytics data.
        debug {
            manifestPlaceholders = [firebaseCollectionEnabled: "false"]
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigning != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        // Resource and color annotations on data class properties apply to the field too (future Kotlin default).
        freeCompilerArgs.add('-Xannotation-default-target=param-property')
    }
}


dependencies {

    implementation platform('androidx.compose:compose-bom:2025.09.01')
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.navigation:navigation-compose:2.8.8'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // material3 1.4 no longer brings the icons in transitively.
    implementation 'androidx.compose.material:material-icons-core'

    implementation 'com.github.alexzhirkevich:custom-qr-generator:2.0.0-alpha01'
    // Declared directly because QrRenderer catches its WriterException; the library exposes it only at runtime.
    implementation 'com.google.zxing:core:3.5.1'

    implementation 'com.github.skydoves:colorpicker-compose:1.0.7'

    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.09.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
