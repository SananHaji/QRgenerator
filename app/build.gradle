import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Crashlytics reads the Firebase project from app/google-services.json, which must list every
// application id that is built (com.sananhaji.qrgenerator and, with the HHM switch on, its .hhm id).
// Until the file is added the plugins stay off and the SDK starts without a project, so it reports nothing.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

// Switch for the HHM company build; see gradle.properties.
def hhmEnabled = providers.gradleProperty('qrgenerator.hhm.enabled')
        .map { it.toBoolean() }
        .getOrElse(false)

android {
    namespace 'com.sananhaji.qrgenerator'
    compileSdk 36

    defaultConfig {
        applicationId "com.sananhaji.qrgenerator"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // store: public Play Store app. hhm: company build with the certificate template.
    // Without the hhm flavor its source set (src/hhm) is not compiled or packaged at all.
    flavorDimensions = ["distribution"]
    productFlavors {
        store {
            dimension "distribution"
        }
        if (hhmEnabled) {
            hhm {
                dimension "distribution"
                applicationIdSuffix ".hhm"
                versionNameSuffix "-hhm"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        // Resource and color annotations on data class properties apply to the field too (future Kotlin default).
        freeCompilerArgs.add('-Xannotation-default-target=param-property')
    }
}


dependencies {

    implementation platform('androidx.compose:compose-bom:2025.09.01')
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.navigation:navigation-compose:2.8.8'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // material3 1.4 no longer brings the icons in transitively.
    implementation 'androidx.compose.material:material-icons-core'

    implementation 'com.github.alexzhirkevich:custom-qr-generator:2.0.0-alpha01'
    // Declared directly because QrRenderer catches its WriterException; the library exposes it only at runtime.
    implementation 'com.google.zxing:core:3.5.1'

    implementation 'com.github.skydoves:colorpicker-compose:1.0.7'

    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-crashlytics'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.09.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
